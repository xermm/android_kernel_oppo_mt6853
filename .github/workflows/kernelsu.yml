name: Build PERM00 kernel for offset analysis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make bc bison ccache openssl dos2unix zip kmod cpio \
            flex libelf-dev curl libssl-dev wget device-tree-compiler \
            ca-certificates python3 binutils binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi dwarves

      - name: Download GCC toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          cd "$GITHUB_WORKSPACE/toolchains"
          mkdir -p gcc64 gcc32
          wget -q -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxf gcc-aarch64.tar.gz
          wget -q -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxf gcc-arm.tar.gz

      - name: Download Clang toolchain
        run: |
          cd "$GITHUB_WORKSPACE/toolchains"
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      - name: Configure kernel to match device
        run: |
          cd "$GITHUB_WORKSPACE/kernel-4.14"
          make -s -j"$(nproc --all)" O=out ARCH=arm64 OPPO-K7x_defconfig
          ./scripts/config --file out/.config \
            -e LTO -e LTO_CLANG -e THINLTO -e CFI_CLANG -e CFI_CLANG_SHADOW \
            -e MODULE_SIG -e MODULE_SIG_ALL -e MODULE_SIG_FORCE \
            -e MODULE_SIG_SHA512 -d MODULE_SIG_SHA1 \
            -e OPLUS_ION_BOOSTPOOL \
            -d KALLSYMS_ALL -d KPROBES -d BT -d MTK_COMBO_BT -d MTK_COMBO_COMM \
            -d CRYPTO_ZSTD -d IOMONITOR -d SECURITY_SELINUX_BOOTPARAM \
            -d SECURITY_SELINUX_DEVELOP -d SECURITY_SELINUX_DISABLE \
            -d LOCALVERSION_AUTO --set-str LOCALVERSION "" \
            -e DEBUG_INFO -e DEBUG_INFO_DWARF4
          make -s -j"$(nproc --all)" O=out ARCH=arm64 olddefconfig
          grep -E 'LTO|CFI|DEBUG_INFO|MODULE_SIG' out/.config

      - name: Build kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel-4.14"
          export PATH="$GITHUB_WORKSPACE/toolchains/clang-aosp/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export KBUILD_BUILD_HOST=gmail.com
          export KBUILD_BUILD_USER=fangkuaixiaoqiao
          make -j"$(nproc --all)" CC=clang O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Dump symbols and struct offsets
        run: |
          cd "$GITHUB_WORKSPACE/kernel-4.14"
          ls -lh out/vmlinux out/System.map
          pahole -C task_struct out/vmlinux > out/task_struct.txt || true
          pahole -C rt_mutex_waiter out/vmlinux > out/rt_mutex_waiter.txt || true
          pahole -C cred out/vmlinux > out/cred.txt || true
          pahole -C rt_mutex out/vmlinux > out/rt_mutex.txt || true
          pahole -C task_group out/vmlinux > out/task_group.txt || true
          pahole -C selinux_state out/vmlinux > out/selinux_state.txt || true
          pahole -C mm_struct out/vmlinux > out/mm_struct.txt || true
          pahole -C pipe_buffer out/vmlinux > out/pipe_buffer.txt || true
          pahole -C page out/vmlinux > out/page.txt || true
          pahole -C file_operations out/vmlinux > out/file_operations.txt || true
          objcopy --strip-debug out/vmlinux out/vmlinux.stripped || true
          ls -lh out/vmlinux.stripped || true
          grep -E ' (init_task|init_cred|selinux_enforcing|root_task_group|_stext|_text)$' out/System.map > out/key_symbols.txt || true
          cat out/key_symbols.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perm00-offsets-lto
          path: |
            kernel-4.14/out/.config
            kernel-4.14/out/task_struct.txt
            kernel-4.14/out/rt_mutex_waiter.txt
            kernel-4.14/out/cred.txt
            kernel-4.14/out/rt_mutex.txt
            kernel-4.14/out/task_group.txt
            kernel-4.14/out/selinux_state.txt
            kernel-4.14/out/mm_struct.txt
            kernel-4.14/out/pipe_buffer.txt
            kernel-4.14/out/page.txt
            kernel-4.14/out/file_operations.txt
            kernel-4.14/out/vmlinux.stripped
            kernel-4.14/out/key_symbols.txt
            kernel-4.14/out/System.map
            kernel-4.14/out/arch/arm64/boot/Image.gz-dtb
